name: Triage
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'new', color: '0e8a16', description: 'Reported, not yet looked at' },
              { name: 'in review', color: 'fbca04', description: 'Someone has replied and it is being looked at' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }
      - name: Label new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: ['new'],
            });
      - name: Label feature requests
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[Feature]')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ['feature request'] });
      - name: Mark in review on the first reply
        if: >
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          github.event.comment.user.type != 'Bot' &&
          github.event.comment.user.login != github.event.issue.user.login &&
          contains(github.event.issue.labels.*.name, 'new')
        uses: actions/github-script@v7
        with:
          script: |
            const base = { ...context.repo, issue_number: context.issue.number };
            await github.rest.issues.removeLabel({ ...base, name: 'new' });
            await github.rest.issues.addLabels({ ...base, labels: ['in review'] });
